<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Grotesk; src: url(assets/fonts/space-grotesk-latin-500-normal.woff2); font-weight: 500; }
@font-face { font-family: Grotesk; src: url(assets/fonts/space-grotesk-latin-600-normal.woff2); font-weight: 600; }
@font-face { font-family: Grotesk; src: url(assets/fonts/space-grotesk-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: Serif; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2); font-style: italic; }
@font-face { font-family: Mono; src: url(assets/fonts/jetbrains-mono-latin-400-normal.woff2); font-weight: 400; }
@font-face { font-family: Mono; src: url(assets/fonts/jetbrains-mono-latin-500-normal.woff2); font-weight: 500; }

:root { --ink: #16161a; --paper: #f1efea; --accent: #ff5a36; --lime: #c8f53a; --pink: #ff2d78; --muted: #8a8780; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Grotesk, sans-serif; color: var(--ink); }

/* backgrounds: light paper with fine dot grain, dark with neon glow */
.bg { position: absolute; inset: 0; }
#bgLight { background: radial-gradient(circle, rgba(0,0,0,.07) 1px, transparent 1.3px) 0 0 / 7px 7px, var(--paper); }
#bgDark { background: radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1.3px) 0 0 / 7px 7px,
  radial-gradient(60% 40% at 85% 95%, rgba(255,45,120,.55), transparent 70%),
  radial-gradient(50% 30% at 0% 0%, rgba(200,245,58,.35), transparent 70%), #0d0e10; opacity: 0; }
#glow { position: absolute; width: 900px; height: 900px; left: 300px; top: 1100px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,90,54,.35), transparent 65%); opacity: 0; }

.hud { position: absolute; top: 120px; font: 500 30px Mono, monospace; letter-spacing: .02em; color: var(--muted); }
#label { left: 110px; }
#counter { right: 110px; text-transform: uppercase; }
#counter b { color: var(--accent); font-weight: 500; }

#headline { position: absolute; left: 110px; right: 110px; top: 210px; font-weight: 600; font-size: 82px; line-height: 1.1; letter-spacing: -.025em; }
#headline .w { display: inline-block; white-space: pre; will-change: transform, opacity; }
#headline .acc { font-family: Serif; font-style: italic; font-weight: 400; color: var(--accent); font-size: 1.12em; letter-spacing: -.01em; line-height: .9; }
#headline .hi { color: var(--accent); }
.dark #headline .hi { color: var(--lime); }
.dark #headline, .dark .hud, .dark .on-bg { color: #f4f3ef; }
.dark .hud { color: #8f8f8f; }

#visuals { position: absolute; inset: 0; pointer-events: none; }
.vis { position: absolute; will-change: transform, opacity; }
.card { background: #fff; border-radius: 34px; box-shadow: 0 30px 60px -20px rgba(20,20,30,.25), 0 0 0 2px rgba(0,0,0,.04); }
.dark .card { background: #17181c; color: #f4f3ef; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.06); }
.mono { font-family: Mono, monospace; }
.tag { position: absolute; font: 500 26px Mono; padding: 10px 20px; border-radius: 40px; background: var(--ink); color: #fff; white-space: nowrap; }

#avatar { position: absolute; width: 600px; height: 769px; left: 500px; top: 1180px; will-change: transform; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg" id="bgLight"></div>
  <div class="bg" id="bgDark"></div>
  <div id="glow"></div>
  <div class="hud" id="label"></div>
  <div class="hud" id="counter"></div>
  <div id="headline"></div>
  <div id="visuals"></div>
  <svg id="avatar" viewBox="0 0 640 820"></svg>
</div>
<script>
// ---------- easing helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, s, d) => clamp((t - s) / d);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const back = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
// damped spring 0 -> 1
const spring = t => t <= 0 ? 0 : 1 - Math.exp(-7 * t) * Math.cos(13 * t);
const $ = s => document.querySelector(s);
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

const ICONS = {
  check: '<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  flame: '<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.3-4 2.5-5 .2 2 1 3 2 3.3C11 8.5 10.5 5.5 12 2z" fill="currentColor"/></svg>',
  x: '<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg>',
  bell: '<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6zm-2.5 15a2.5 2.5 0 0 0 5 0" fill="currentColor"/></svg>',
  star: '<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="currentColor"/></svg>',
};
// Forma logo mark: rounded tile with a stacked "F" built from habit bars
const LOGO = (s) => `<div style="width:${s}px;height:${s}px;border-radius:${s * .26}px;background:linear-gradient(145deg,#ff7a4d,#ff4a2a);display:grid;place-items:center;box-shadow:0 ${s * .12}px ${s * .3}px -${s * .1}px rgba(255,74,42,.6)">
  <svg viewBox="0 0 40 40" width="${s * .56}" height="${s * .56}"><rect x="8" y="7" width="24" height="7" rx="3.5" fill="#fff"/><rect x="8" y="17" width="17" height="7" rx="3.5" fill="#fff" opacity=".85"/><rect x="8" y="27" width="7" height="7" rx="3.5" fill="#fff" opacity=".7"/></svg></div>`;

// ---------- visuals: each has build(params) -> element, update(el, lt, dur, params) ----------
const V = {};

// grid of other habit apps getting crossed out one by one
V.apps = {
  build(p) {
    const e = h('div', 'vis'); e.style.cssText = 'left:110px;top:640px;width:860px;display:grid;grid-template-columns:repeat(5,1fr);gap:26px';
    const cols = ['#7c6cf2', '#2bb673', '#f2b33d', '#3d8ef2', '#e8576b', '#25b5c4', '#9b59b6', '#f27d3d', '#5c6b7a', '#d4a017', '#6c8cff', '#e0559f'];
    const glyphs = ['✓', '◎', '★', '▲', '♥', '◆', '●', '✦', '■', '☀', '☾', '✿'];
    for (let i = 0; i < (p.n || 10); i++) {
      const c = h('div', '', `<div style="position:absolute;inset:0;border-radius:36px;background:${cols[i % 12]};display:grid;place-items:center;color:#fff;font-size:70px">${glyphs[i % 12]}</div>
        <div class="x" style="position:absolute;inset:-6px;color:#ff3b30;opacity:0">${ICONS.x}</div>
        <div class="mono" style="position:absolute;top:166px;width:100%;text-align:center;font-size:20px;color:#8a8780">day ${[3, 5, 2, 6, 4, 1, 7, 2, 5, 3, 4, 2][i % 12]}</div>`);
      c.style.cssText = 'position:relative;aspect-ratio:1;';
      e.append(c);
    }
    return e;
  },
  update(e, t, d, p) {
    [...e.children].forEach((c, i) => {
      const s = spring(t - i * .05);
      c.style.transform = `scale(${lerp(.4, 1, s)})`; c.style.opacity = clamp(s * 2);
      const xs = .5 + i * (d - .9) / e.children.length;
      const k = prog(t, xs, .25);
      c.querySelector('.x').style.opacity = k;
      c.querySelector('.x').style.transform = `scale(${lerp(1.8, 1, easeOut(k))})`;
      c.firstElementChild.style.filter = `grayscale(${k}) brightness(${1 - k * .15})`;
      c.firstElementChild.style.opacity = 1 - k * .5;
    });
  }
};

// the Forma app itself: Today, habits grouped by time of day, checked off one by one
const PHONE_FRAME = 'width:470px;height:900px;border-radius:70px;background:#111;padding:16px;box-shadow:0 50px 90px -30px rgba(0,0,0,.45)';
V.phone = {
  build(p) {
    const e = h('div', 'vis');
    e.style.cssText = 'left:120px;top:620px;' + PHONE_FRAME;
    const habits = p.habits || [['💧', 'Drink water', 'Morning'], ['🧘', 'Stretch 5 min', 'Morning'], ['🚶', 'Walk 20 min', 'Afternoon'], ['📖', 'Read 10 pages', 'Evening']];
    let html = '', grp = null;
    habits.forEach(([em, name, g], i) => {
      if (g !== grp) { grp = g; html += `<div class="mono" style="font-size:17px;letter-spacing:.08em;color:#a09d95;margin:${i ? 18 : 4}px 4px 10px;text-transform:uppercase">${g}</div>`; }
      html += `<div class="hb" style="display:flex;align-items:center;gap:16px;background:#fff;border-radius:24px;padding:16px 18px;margin-bottom:10px;box-shadow:0 0 0 2px #eeebe4">
        <div style="flex:none;width:52px;height:52px;border-radius:16px;background:#f4f2ed;display:grid;place-items:center;font-size:30px">${em}</div>
        <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:25px;white-space:nowrap">${name}</div><div class="mono" style="font-size:16px;color:#a09d95;margin-top:2px">🔥 ${[12, 43, 8, 21, 5, 30][i % 6]} days</div></div>
        <div class="ck" style="flex:none;width:46px;height:46px;border-radius:50%;border:4px solid #dcd8cf;color:#fff;padding:6px"></div></div>`;
    });
    e.innerHTML = `<div style="position:relative;width:100%;height:100%;border-radius:56px;background:#fbfaf7;color:#16161a;overflow:hidden;padding:72px 28px 0">
      <div style="position:absolute;top:22px;left:50%;transform:translateX(-50%);width:130px;height:36px;border-radius:20px;background:#111"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:0 4px 18px">
        <div><div class="mono" style="font-size:18px;color:#8a8780">${p.date || 'TUE, OCT 6'}</div><div style="font-weight:700;font-size:48px;letter-spacing:-.03em">Today</div></div>
        <svg viewBox="0 0 100 100" width="96" height="96"><circle cx="50" cy="50" r="40" fill="none" stroke="#eeebe4" stroke-width="11"/><circle class="ring" cx="50" cy="50" r="40" fill="none" stroke="#ff5a36" stroke-width="11" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="251.3" transform="rotate(-90 50 50)"/><text class="rt" x="50" y="58" text-anchor="middle" font-family="Grotesk" font-weight="700" font-size="24" fill="#16161a">0/4</text></svg>
      </div>${html}</div>
    <div class="finger" style="position:absolute;width:80px;height:80px;border-radius:50%;background:rgba(255,90,54,.25);border:4px solid rgba(255,90,54,.7);opacity:0"></div>`;
    return e;
  },
  update(e, t, d, p) {
    const s = spring(t);
    e.style.transform = `translateY(${lerp(500, 0, s)}px) rotate(${lerp(8, -3, s)}deg)`;
    const hbs = [...e.querySelectorAll('.hb')], n = hbs.length;
    const checks = p.checks == null ? n : p.checks;
    let done = 0;
    const f = e.querySelector('.finger');
    f.style.opacity = 0;
    hbs.forEach((hb, i) => {
      const at = .6 + i * Math.max(.35, (d - 1.2) / Math.max(1, checks));
      const k = i < checks ? prog(t, at, .18) : 0;
      if (k > 0) done++;
      const ck = hb.querySelector('.ck');
      ck.innerHTML = k > 0 ? ICONS.check : '';
      ck.style.background = k > 0 ? '#ff5a36' : 'transparent';
      ck.style.borderColor = k > 0 ? '#ff5a36' : '#dcd8cf';
      ck.style.transform = `scale(${k > 0 ? lerp(1.35, 1, easeOut(k)) : 1})`;
      hb.style.opacity = k > 0 ? .62 + (1 - k) * .38 : 1;
      if (i < checks && t > at - .3 && t < at + .35) {
        const near = 1 - Math.abs(t - at) / .35;
        f.style.opacity = clamp(near * 1.5);
        f.style.left = (16 + 28 + hb.offsetLeft + hb.offsetWidth - 18 - 23 - 40) + 'px';
        f.style.top = (16 + hb.offsetTop + hb.offsetHeight / 2 - 40) + 'px';
        f.style.transform = `scale(${lerp(1.3, .85, clamp(near))})`;
      }
    });
    e.querySelector('.ring').setAttribute('stroke-dashoffset', 251.3 * (1 - done / n));
    e.querySelector('.rt').textContent = `${done}/${n}`;
  }
};

// a real app screenshot (put PNGs in assets/screens/) in a phone frame with a slow push-in
V.shot = {
  build(p) {
    const e = h('div', 'vis');
    e.style.cssText = `left:${p.left || 120}px;top:${p.top || 600}px;` + PHONE_FRAME;
    e.innerHTML = `<div style="width:100%;height:100%;border-radius:56px;overflow:hidden;background:#fff"><img src="assets/screens/${p.src}" style="width:100%;height:100%;object-fit:cover;object-position:top;transform-origin:${p.focus || '50% 30%'}"></div>`;
    return e;
  },
  update(e, t, d, p) {
    const s = spring(t);
    e.style.transform = `translateY(${lerp(500, 0, s)}px) rotate(${lerp(8, p.tilt == null ? -3 : p.tilt, s)}deg)`;
    e.querySelector('img').style.transform = `scale(${lerp(1, p.zoom || 1.06, easeInOut(prog(t, .4, d)))})`;
  }
};

// "no account, works offline" privacy card
V.privacy = {
  build(p) {
    const e = h('div', 'vis card'); e.style.cssText += ';left:110px;top:640px;width:700px;padding:40px 44px';
    const rows = p.rows || [['✈️', 'Airplane mode', 'still works'], ['👤', 'Account', 'not needed'], ['🔒', 'Your data', 'stays on your phone']];
    e.innerHTML = `<div class="mono" style="font-size:24px;color:#8a8780">// ${p.title || 'privacy'}</div>` + rows.map(([ic, a, b]) => `<div class="rw" style="display:flex;align-items:center;gap:22px;margin-top:26px">
      <div style="width:72px;height:72px;border-radius:20px;background:#f4f2ed;display:grid;place-items:center;font-size:38px">${ic}</div>
      <div style="flex:1"><div style="font-weight:600;font-size:38px;letter-spacing:-.02em">${a}</div><div class="mono" style="font-size:22px;color:#8a8780">${b}</div></div>
      <div class="tg" style="width:96px;height:56px;border-radius:30px;background:#dcd8cf;position:relative"><div class="kn" style="position:absolute;top:6px;left:6px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)"></div></div></div>`).join('');
    return e;
  },
  update(e, t, d) {
    const s = spring(t); e.style.transform = `translateY(${lerp(140, 0, s)}px) rotate(${lerp(-4, -1.5, s)}deg)`; e.style.opacity = clamp(t * 4);
    e.querySelectorAll('.rw').forEach((r, i) => {
      const a = spring(t - .1 - i * .1); r.style.opacity = clamp(a * 2); r.style.transform = `translateX(${lerp(-40, 0, a)}px)`;
      const k = easeOut(prog(t, .5 + i * (d - 1) / 3, .2));
      r.querySelector('.kn').style.left = lerp(6, 46, k) + 'px';
      r.querySelector('.tg').style.background = k > .5 ? '#34c759' : '#dcd8cf';
    });
  }
};

// subscription vs one-time price comparison
V.compare = {
  build(p) {
    const e = h('div', 'vis'); e.style.cssText = 'left:110px;top:650px;width:860px;display:flex;gap:30px;color:#16161a';
    const col = (title, price, per, rows, good) => `<div class="cl card" style="flex:1;padding:34px 32px;${good ? 'box-shadow:0 0 0 5px #ff5a36,0 30px 60px -20px rgba(255,90,54,.4)' : ''}">
      <div class="mono" style="font-size:22px;color:#8a8780">${title}</div>
      <div style="font-weight:700;font-size:84px;letter-spacing:-.04em;margin-top:6px">${price}</div><div class="mono" style="font-size:22px;color:#8a8780">${per}</div>
      ${rows.map(r => `<div style="display:flex;gap:12px;align-items:center;margin-top:18px;font-weight:600;font-size:26px"><span style="width:30px;height:30px;color:${good ? '#ff5a36' : '#c7c3ba'}">${good ? ICONS.check : ICONS.x}</span>${r}</div>`).join('')}
      ${good ? '' : '<div class="slash" style="position:absolute;left:20px;right:20px;top:120px;height:12px;border-radius:6px;background:#ff3b30;transform:rotate(-14deg) scaleX(0);transform-origin:left"></div>'}</div>`;
    e.innerHTML = col(p.leftTitle || 'other apps', p.leftPrice || '$59', p.leftPer || 'every year', p.leftRows || ['account wall', 'upsells', 'forever bill'], false)
      + col(p.rightTitle || 'forma pro', p.rightPrice || 'Once', p.rightPer || 'pay once, keep it', p.rightRows || ['no account', 'works offline', 'no subscription'], true);
    e.querySelectorAll('.cl').forEach(c => c.style.position = 'relative');
    return e;
  },
  update(e, t) {
    const [a, b] = e.querySelectorAll('.cl'), sa = spring(t), sb = spring(t - .35);
    a.style.transform = `translateY(${lerp(140, 0, sa)}px) rotate(${lerp(-6, -2, sa)}deg)`; a.style.opacity = clamp(t * 4);
    b.style.transform = `translateY(${lerp(140, 0, sb)}px) rotate(${lerp(6, 2, sb)}deg) scale(${lerp(.9, 1.03, sb)})`; b.style.opacity = clamp((t - .35) * 4);
    const sl = e.querySelector('.slash'); if (sl) sl.style.transform = `rotate(-14deg) scaleX(${easeOut(prog(t, .9, .25))})`;
  }
};

// big streak counter
V.streak = {
  build(p) {
    const e = h('div', 'vis card');
    e.style.cssText += ';left:110px;top:640px;width:620px;padding:46px 50px';
    e.innerHTML = `<div class="mono" style="font-size:24px;color:#8a8780">// current streak</div>
      <div style="display:flex;align-items:flex-end;gap:20px;margin-top:10px">
        <div style="width:120px;height:150px;color:#ff5a36" class="fl">${ICONS.flame}</div>
        <div class="num" style="font-weight:700;font-size:200px;line-height:.85;letter-spacing:-.05em">0</div>
        <div style="font-weight:600;font-size:40px;margin-bottom:18px;color:#8a8780">days</div></div>
      <div style="display:flex;gap:14px;margin-top:38px">${'MTWTFSS'.split('').map(x => `<div style="flex:1;text-align:center"><div class="dd" style="aspect-ratio:1;border-radius:50%;background:#eeebe4;color:#fff;padding:12px"></div><div class="mono" style="font-size:20px;color:#a09d95;margin-top:8px">${x}</div></div>`).join('')}</div>`;
    return e;
  },
  update(e, t, d, p) {
    const s = spring(t);
    e.style.transform = `translateY(${lerp(120, 0, s)}px) scale(${lerp(.85, 1, s)}) rotate(${lerp(-4, -1.5, s)}deg)`; e.style.opacity = clamp(t * 4);
    const k = easeInOut(prog(t, .2, Math.min(d - .4, 2.2)));
    e.querySelector('.num').textContent = Math.round(lerp(p.from || 0, p.to || 43, k));
    e.querySelector('.fl').style.transform = `scale(${1 + .06 * Math.sin(t * 9)}) rotate(${3 * Math.sin(t * 5)}deg)`;
    e.querySelectorAll('.dd').forEach((dd, i) => { const on = t > .4 + i * .18; dd.style.background = on ? '#ff5a36' : '#eeebe4'; dd.innerHTML = on ? ICONS.check : ''; });
  }
};

// contribution-style heatmap filling in
V.heatmap = {
  build(p) {
    const e = h('div', 'vis card');
    const cols = p.weeks || 12;
    e.style.cssText += `;left:110px;top:640px;width:${Math.min(860, 88 + cols * 61)}px;padding:40px 44px`;
    let cells = '';
    for (let c = 0; c < cols; c++) for (let r = 0; r < 7; r++) cells += `<div class="c" data-i="${c * 7 + r}" style="aspect-ratio:1;border-radius:9px;background:#eeebe4"></div>`;
    e.innerHTML = `<div style="display:flex;justify-content:space-between"><div class="mono" style="font-size:24px;color:#8a8780">// ${p.title || 'last 12 weeks'}</div><div class="mono pct" style="font-size:24px;color:#ff5a36">0%</div></div>
      <div style="display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,52px);grid-auto-columns:52px;gap:9px;margin-top:26px">${cells}</div>`;
    return e;
  },
  update(e, t, d, p) {
    const s = spring(t); e.style.transform = `translateY(${lerp(140, 0, s)}px) rotate(${lerp(3, 1, s)}deg)`; e.style.opacity = clamp(t * 4);
    const cs = e.querySelectorAll('.c'), n = cs.length, k = prog(t, .2, d - .6);
    let on = 0;
    cs.forEach((c, i) => {
      const seed = Math.sin(i * 12.9898) * 43758.5453 % 1, miss = Math.abs(seed) < (p.gaps == null ? .12 : p.gaps) && i < n * .5;
      const lit = i / n < k && !miss; if (lit) on++;
      const lvl = .55 + Math.abs(seed) * .45;
      c.style.background = lit ? `rgba(255,90,54,${lvl})` : '#eeebe4';
    });
    e.querySelector('.pct').textContent = Math.round(on / n * 100) + '%';
  }
};

// home screen with the Forma widget
V.widget = {
  build(p) {
    const e = h('div', 'vis');
    e.style.cssText = 'left:120px;top:600px;width:470px;height:900px;border-radius:70px;background:#111;padding:16px;box-shadow:0 50px 90px -30px rgba(0,0,0,.45)';

    <path id="mTeeth" fill="#fff"/>
    <path id="mClosed" fill="none" stroke="#3b1416" stroke-width="9" stroke-linecap="round"/>
  </g>
  <path id="sweat" d="M476 250 C 468 270, 464 280, 476 290 C 488 280, 484 270, 476 250 Z" fill="#7cc4ff" opacity="0"/>
</g>`;

const MOODS = {
  neutral: { brow: 0, smile: .35, lift: 0 },
  happy: { brow: -4, smile: 1, lift: -4 },
  excited: { brow: -10, smile: 1.2, lift: -8, hand: 1 },
  worried: { brow: 10, smile: -.6, lift: 0, sweat: 1, look: -1 },
  smug: { brow: -2, smile: .7, lift: 0, tilt: -4, look: 1 },
  serious: { brow: 6, smile: 0, lift: 0 },
};
function avatar(t, open, mood, prevMood, mt) {
  const a = MOODS[prevMood] || MOODS.neutral, b = MOODS[mood] || MOODS.neutral, k = easeOut(clamp(mt / .3));
  const m = {}; for (const key of ['brow', 'smile', 'lift', 'tilt', 'sweat', 'hand', 'look']) m[key] = lerp(a[key] || 0, b[key] || 0, k);
  const bob = Math.sin(t * 2.1) * 6 + open * 6, sway = Math.sin(t * 1.3) * 1.8 + (m.tilt || 0);
  $('#av-head').setAttribute('transform', `translate(0 ${bob + m.lift}) rotate(${sway} 320 560)`);
  $('#av-body').setAttribute('transform', `translate(0 ${bob * .35})`);
  const hk = spring(m.hand * 1.2) * m.hand, hand = $('#av-hand');
  hand.setAttribute('opacity', clamp(hk * 3));
  hand.setAttribute('transform', `translate(0 ${(1 - hk) * 360 + bob * .35}) rotate(${Math.sin(t * 9) * 8 * hk} 140 600)`);
  const br = m.brow;
  $('#brL').setAttribute('d', `M222 ${300 + br} Q 256 ${284 + br * .3} 290 ${296 - br * .6}`);
  $('#brR').setAttribute('d', `M350 ${296 - br * .6} Q 384 ${284 + br * .3} 418 ${300 + br}`);
  const bp = (t + .7) % 3.1, blink = bp < .14 ? Math.sin(bp / .14 * Math.PI) : 0, sy = 1 - blink * .92;
  const lx = (m.look || 0) * 7 + Math.sin(t * .7) * 2;
  $('#eyeL').setAttribute('transform', `translate(0 352) scale(1 ${sy}) translate(0 -352)`);
  $('#eyeR').setAttribute('transform', `translate(0 352) scale(1 ${sy}) translate(0 -352)`);
  document.querySelectorAll('#avatar .pp').forEach(p => p.setAttribute('transform', `translate(${lx} 0)`));
  const sm = m.smile, w = 44 - open * 10, hgt = open * 46;
  if (open > .06) {
    const top = -4 - sm * 4, bot = top + hgt + 6 + sm * 6;
    $('#mOpen').setAttribute('d', `M${-w} ${top} Q 0 ${top - 6 + sm * 2} ${w} ${top} Q ${w * .9} ${bot} 0 ${bot} Q ${-w * .9} ${bot} ${-w} ${top} Z`);
    $('#mTeeth').setAttribute('d', `M${-w * .8} ${top + 1} Q 0 ${top - 3} ${w * .8} ${top + 1} L ${w * .7} ${top + 10} Q 0 ${top + 7} ${-w * .7} ${top + 10} Z`);
    $('#mTongue').setAttribute('d', `M${-w * .5} ${bot - 3} Q 0 ${bot - hgt * .5} ${w * .5} ${bot - 3} Q 0 ${bot + 2} ${-w * .5} ${bot - 3} Z`);
    $('#mClosed').setAttribute('d', '');
  } else {
    for (const id of ['#mOpen', '#mTeeth', '#mTongue']) $(id).setAttribute('d', '');
    $('#mClosed').setAttribute('d', `M-38 ${-sm * 6} Q 0 ${sm * 22} 38 ${-sm * 6}`);
  }
  const sw = $('#sweat'); sw.setAttribute('opacity', (m.sweat || 0) * .95); sw.setAttribute('transform', `translate(0 ${(t * 30) % 40 * (m.sweat || 0)})`);
}

// ---------- timeline driver ----------
const TL = window.TIMELINE;
const headline = $('#headline'), visRoot = $('#visuals');
let curScene = -1, wordEls = [];
const visEls = TL.visuals.map(v => null);

function markup(words) {
  headline.innerHTML = '';
  wordEls = words.map(w => {
    const e = h('span', 'w' + (w.cls ? ' ' + w.cls : ''));
    e.textContent = w.text;
    headline.append(e, document.createTextNode(' '));
    return e;
  });
}

window.renderAt = function (t) {
  const si = Math.max(0, TL.scenes.findIndex(s => t >= s.start && t < s.end) === -1 ? TL.scenes.length - 1 : TL.scenes.findIndex(s => t >= s.start && t < s.end));
  const sc = TL.scenes[si], lt = t - sc.start;
  if (si !== curScene) { markup(sc.words); curScene = si; $('#label').textContent = sc.label || ''; }

  const dark = sc.theme === 'dark';
  document.body.classList.toggle('dark', dark);
  const prevDark = si > 0 && TL.scenes[si - 1].theme === 'dark';
  const th = prevDark === dark ? 1 : easeOut(clamp(lt / .35));
  $('#bgDark').style.opacity = dark ? th : 1 - th;

  // headline: whole sentence fades in faint, each spoken word snaps to full ink
  const enter = easeOut(clamp(lt / .25));
  wordEls.forEach((e, i) => {
    const wt = sc.words[i].t - sc.start, k = easeOut(clamp((lt - wt + .06) / .14));
    e.style.opacity = (.16 + .84 * k) * enter;
    e.style.transform = `translateY(${(1 - enter) * 40 + (1 - k) * 6}px)`;
  });
  if (sc.counter) {
    const c = sc.counter, k = easeInOut(clamp(lt / Math.max(.3, (sc.end - sc.start) * .8)));
    const v = typeof c.from === 'number' ? Math.round(lerp(c.from, c.to, k)) : c.to;
    $('#counter').innerHTML = `${c.name} <b>${c.prefix || ''}${typeof v === 'number' ? v.toLocaleString('en-US') : v}${c.suffix || ''}</b>`;
  } else $('#counter').innerHTML = '';

  // visuals (may span multiple scenes)
  TL.visuals.forEach((v, i) => {
    const on = t >= v.start && t < v.end + .3;
    if (on && !visEls[i]) { visEls[i] = V[v.type].build(v); visRoot.append(visEls[i]); }
    if (!on && visEls[i]) { visEls[i].remove(); visEls[i] = null; }
    if (on) {
      const e = visEls[i];
      V[v.type].update(e, t - v.start, v.end - v.start, v);
      const out = clamp((t - v.end) / .3);
      if (out > 0) { e.style.opacity = 1 - out; e.style.transform += ` translateY(${-out * 60}px) scale(${1 - out * .08})`; }
    }
  });

  // presenter
  const fi = Math.min(TL.mouth.length - 1, Math.round(t * TL.fps));
  const prev = TL.scenes[Math.max(0, si - 1)].mood || 'neutral';
  avatar(t, TL.mouth[fi] || 0, sc.mood || 'neutral', si === 0 ? (sc.mood || 'neutral') : prev, lt);
  $('#glow').style.opacity = sc.mood === 'worried' ? .9 : 0;
  const pop = TL.avatarIntro ? spring(t * 1.2) : 1;
  $('#avatar').style.transform = `translateY(${(1 - pop) * 500}px)`;
};
</script>
</body>
</html>
